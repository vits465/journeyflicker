    <script>
      (function() {
        // Clear old PWA service workers and browser caches from the old website
        try {
          if ('serviceWorker' in navigator) {
            var MIGRATION_KEY = 'journeyflicker_migration_v2'; // Increment to trigger migration clean-up for all users
            var hasMigration = false;
            try {
              hasMigration = !!localStorage.getItem(MIGRATION_KEY);
            } catch (e) {
              hasMigration = true; // Safe fallback: skip migration to prevent refresh loops if storage is disabled
            }
            if (!hasMigration) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                var cleared = false;
                var unregisterPromises = [];
                for (var i = 0; i < registrations.length; i++) {
                  unregisterPromises.push(registrations[i].unregister());
                  cleared = true;
                }
                
                var cachePromise = Promise.resolve();
                try {
                  if ('caches' in window) {
                    cachePromise = caches.keys().then(function(names) {
                      var deletePromises = [];
                      for (var j = 0; j < names.length; j++) {
                        deletePromises.push(caches.delete(names[j]));
                        cleared = true;
                      }
                      return Promise.all(deletePromises);
                    }).catch(function() {
                      return Promise.resolve();
                    });
                  }
                } catch (cErr) {
                  console.warn('Cache migration check failed:', cErr);
                }

                Promise.all([Promise.all(unregisterPromises), cachePromise]).then(function() {
                  try {
                    localStorage.setItem(MIGRATION_KEY, 'true');
                  } catch (e) {}
                  if (cleared) {
                    window.location.reload();
                  }
                }).catch(function() {
                  try {
                    localStorage.setItem(MIGRATION_KEY, 'true');
                  } catch (e) {}
                  window.location.reload();
                });
              }).catch(function(swErr) {
                console.warn('SW registrations search failed:', swErr);
              });
            }
          }
        } catch (swInitErr) {
          console.warn('Service worker migration initialisation failed:', swInitErr);
        }

        // Global chunk/module load error handler (auto-healing for updates)
        function forceRefreshAndClearCache() {
          var lastForceReload = null;
          try {
            lastForceReload = sessionStorage.getItem('jf_last_force_reload');
          } catch (e) {}
          var now = Date.now();
          if (lastForceReload && (now - parseInt(lastForceReload)) < 10000) {
            console.warn('Force reload was triggered less than 10 seconds ago. Stopping to prevent loop.');
            return;
          }
          try {
            sessionStorage.setItem('jf_last_force_reload', now.toString());
          } catch (e) {}

          console.log('Clearing Service Worker registrations and cache due to chunk loading failure...');
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                var unregisterPromises = [];
                for (var i = 0; i < registrations.length; i++) {
                  unregisterPromises.push(registrations[i].unregister());
                }
                
                var cachePromise = Promise.resolve();
                try {
                  if ('caches' in window) {
                    cachePromise = caches.keys().then(function(names) {
                      var deletePromises = [];
                      for (var j = 0; j < names.length; j++) {
                        deletePromises.push(caches.delete(names[j]));
                      }
                      return Promise.all(deletePromises);
                    }).catch(function() {
                      return Promise.resolve();
                    });
                  }
                } catch (cErr) {
                  console.warn('Cache key retrieval failed:', cErr);
                }

                Promise.all([Promise.all(unregisterPromises), cachePromise]).then(function() {
                  performCacheBustingReload();
                }).catch(function() {
                  performCacheBustingReload();
                });
              }).catch(function() {
                performCacheBustingReload();
              });
            } else {
              performCacheBustingReload();
            }
          } catch (swForceErr) {
            console.warn('SW force reload clean failed:', swForceErr);
            performCacheBustingReload();
          }
        }

        function performCacheBustingReload() {
          try {
            var url = new URL(window.location.href);
            url.searchParams.set('cb', Date.now().toString());
            window.location.replace(url.toString());
          } catch (e) {
            window.location.reload();
          }
        }

        // 1. Vite-specific preload error event
        window.addEventListener('vite:preloadError', function(event) {
          console.error('Vite preload error detected:', event);
          event.preventDefault();
          forceRefreshAndClearCache();
        });

        // 2. Global runtime error handler for script loading failures
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var isChunkError = msg.indexOf('Failed to fetch dynamically imported module') > -1 || 
                             msg.indexOf('ChunkLoadError') > -1 || 
                             msg.indexOf('Loading chunk') > -1;
          
          if (!isChunkError && event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
            var src = event.target.src || event.target.href || '';
            if (src.indexOf('/assets/') > -1) {
              isChunkError = true;
            }
          }

          if (isChunkError) {
            console.error('Chunk loading error detected:', event);
            event.preventDefault();
            forceRefreshAndClearCache();
          }
        }, true); // Capture phase is critical to intercept resource loading errors

        // 3. Global unhandled promise rejection handler
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.indexOf('Failed to fetch dynamically imported module') > -1 || 
              msg.indexOf('ChunkLoadError') > -1 || 
              msg.indexOf('Loading chunk') > -1) {
            console.error('Unhandled chunk loading promise rejection detected:', event);
            event.preventDefault();
            forceRefreshAndClearCache();
          }
        });
      })();
    </script>
